name: keepalive
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "HEALTH_URL secret not set"; exit 1; }
          curl -fsS --max-time 30 "$HEALTH_URL"
